name: CI

on:
  push:
    branches: [ master ]

jobs:
  test:
    name: Build ed25519 library and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build ed25519 library
        working-directory: android
        run: |
          cmake .
          make

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run tests
        env:
          ED215519_SO_FILE: ${{ github.workspace }}/android/libed25519_blake2b.so
        run: |
          flutter pub get
          flutter test
